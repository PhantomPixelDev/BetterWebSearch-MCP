{{ $currentPage := . }}
{{ $currentSection := .Section }}

{{ if eq $currentSection "docs" }}
<aside class="hidden lg:block w-56 shrink-0">
  <nav class="sticky top-36 space-y-1" aria-label="Documentation navigation">
    {{ range .Site.RegularPages }}
      {{ if eq .Section "docs" }}
        {{ $isActive := eq $currentPage.RelPermalink .RelPermalink }}
        <a
          href="{{ .RelPermalink }}"
          class="block px-3 py-1.5 text-sm rounded-lg transition-colors
            {{ if $isActive }}
              bg-primary-100 text-primary-700 dark:bg-primary-900/30 dark:text-primary-400 font-medium
            {{ else }}
              text-neutral-600 hover:text-neutral-900 hover:bg-neutral-100 dark:text-neutral-400 dark:hover:text-neutral-200 dark:hover:bg-neutral-800
            {{ end }}">
          {{ .Title }}
        </a>
      {{ end }}
    {{ end }}
  </nav>
</aside>
{{ end }}
