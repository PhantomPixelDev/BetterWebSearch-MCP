baseURL = "https://phantompixeldev.github.io/BetterWebSearch-MCP/"
locale = "en-us"
title = "BetterWebSearch MCP"
theme = "blowfish"
enableRobotsTXT = true
canonifyURLs = true

[params]
  description = "Keyless-first MCP for better web research — DuckDuckGo out of the box, Brave/Tavily optional, 3-tier extraction."
  colorScheme = "blowfish"
  defaultAppearance = "dark"
  enableSearch = true
  disableTextInHeader = false
  highlightCurrentMenuArea = true

[params.header]
  layout = "floating"
  mobileMenuStyle = "fullscreen"

[params.article]
  showTableOfContents = false
  showBreadcrumbs = false
  showHero = false

[params.list]
  showBreadcrumbs = false
  showHero = false

[params.footer]
  showMenu = false
  showAppearanceSwitcher = true
  showScrollToTop = true

[markup.goldmark.renderer]
  unsafe = true

[markup.goldmark.extensions]
  typographer = false

[outputs]
  home = ["HTML", "RSS", "JSON"]

# -- Main Menu (header bar — GitHub icon only) --
[[menus.main]]
  identifier = "github"
  name = "GitHub"
  pre = "github"
  url = "https://github.com/PhantomPixelDev/BetterWebSearch-MCP"
  weight = 200

