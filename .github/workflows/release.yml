name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Trusted Publishing (OIDC): no long-lived npm token needed. npmjs.org
      # verifies the OIDC id-token from this workflow. NOTE: npm provenance
      # requires the GitHub repository to be PUBLIC so the attestation verifies.
      - run: npm publish --provenance --access public
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: better-web-search-mcp-*.tgz
